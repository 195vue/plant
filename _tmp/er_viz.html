<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>body{margin:0;background:#fff}</style>
</head>
<body>
<svg id="er1" width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="Microsoft YaHei, SimHei, sans-serif">
<defs>
<marker id="arr1" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L11,4 L0,8 Z" fill="#2E75B6"/>
</marker>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>

<!-- 主干线：管理员（x=430，内侧） -->
<line x1="430" y1="130" x2="430" y2="550" stroke="#2E75B6" stroke-width="1.8"/>
<!-- 主干线：操作人员（x=390，外侧） -->
<line x1="390" y1="150" x2="390" y2="570" stroke="#2E75B6" stroke-width="1.8"/>

<!-- 管理员图标 -->
<g fill="#2E75B6">
<circle cx="300" cy="182" r="11"/>
<path d="M 284 222 L 284 208 Q 284 196 300 196 Q 316 196 316 208 L 316 222 Z"/>
</g>
<text x="300" y="262" text-anchor="middle" font-size="24" fill="#000">管理员</text>
<line x1="330" y1="200" x2="430" y2="200" stroke="#2E75B6" stroke-width="1.8"/>

<!-- 操作人员图标 -->
<g fill="#2E75B6">
<circle cx="230" cy="412" r="11"/>
<path d="M 214 452 L 214 438 Q 214 426 230 426 Q 246 426 246 438 L 246 452 Z"/>
</g>
<text x="230" y="492" text-anchor="middle" font-size="24" fill="#000">操作人员</text>
<line x1="260" y1="430" x2="390" y2="430" stroke="#2E75B6" stroke-width="1.8"/>

<!-- 浏览人员图标 -->
<g fill="#2E75B6">
<circle cx="1040" cy="122" r="11"/>
<path d="M 1024 162 L 1024 148 Q 1024 136 1040 136 Q 1056 136 1056 148 L 1056 162 Z"/>
</g>
<text x="1040" y="202" text-anchor="middle" font-size="24" fill="#000">浏览人员</text>
<line x1="1010" y1="140" x2="880" y2="140" stroke="#2E75B6" stroke-width="1.8"/>

<!-- 主干线：浏览人员（x=880，右侧） -->
<line x1="880" y1="140" x2="880" y2="560" stroke="#2E75B6" stroke-width="1.8"/>

<!-- 浏览人员分支：4条（指向椭圆右缘） -->
<line x1="880" y1="140" x2="752" y2="140" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="880" y1="280" x2="752" y2="280" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="880" y1="420" x2="752" y2="420" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="880" y1="560" x2="752" y2="560" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>

<!-- 管理员分支：4条（cy-10） -->
<line x1="430" y1="130" x2="488" y2="130" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="430" y1="270" x2="488" y2="270" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="430" y1="410" x2="488" y2="410" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="430" y1="550" x2="488" y2="550" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>

<!-- 操作人员分支：4条（cy+10） -->
<line x1="390" y1="150" x2="488" y2="150" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="390" y1="290" x2="488" y2="290" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="390" y1="430" x2="488" y2="430" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>
<line x1="390" y1="570" x2="488" y2="570" stroke="#2E75B6" stroke-width="1.8" marker-end="url(#arr1)"/>

<!-- 4个椭圆 -->
<ellipse cx="620" cy="140" rx="130" ry="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="148" text-anchor="middle" font-size="22" fill="#000">工程总览</text>
<ellipse cx="620" cy="280" rx="130" ry="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="288" text-anchor="middle" font-size="22" fill="#000">场景切换与漫游</text>
<ellipse cx="620" cy="420" rx="130" ry="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="428" text-anchor="middle" font-size="22" fill="#000">数据统计图表</text>
<ellipse cx="620" cy="560" rx="130" ry="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="568" text-anchor="middle" font-size="22" fill="#000">结构导航与对象详情</text>
</svg>
</body>
</html>
